spring.application.name=helpDesk

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=helpdesk
spring.datasource.password=123

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=TRACE
SPRING_SECURITY_SECRET=${SPRING_SECURITY_SECRET}
openai.api.url=${GPT_URL:https://api.openai.com/v1}
openai.api.key=${IA_KEY}